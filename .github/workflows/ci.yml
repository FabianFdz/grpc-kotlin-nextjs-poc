name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: lint
        run: echo "TODO: run pnpm lint (web) once app code exists"

      # Version pin must track the local buf version documented in CLAUDE.md.
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      - name: buf lint
        run: buf lint

      - name: buf breaking
        run: buf breaking --against ".git#branch=origin/main"

      - name: build-inventory-service
        run: echo "TODO: run ./gradlew :inventory-service:build once implementation exists"

      - name: build-pricing-service
        run: echo "TODO: run ./gradlew :pricing-service:build once implementation exists"

      - name: test-inventory-service
        run: echo "TODO: run ./gradlew :inventory-service:test (covers DummyProductClientTest) once implementation exists"

      - name: build-web
        run: echo "TODO: run pnpm --filter @poc/web build once app code exists"
