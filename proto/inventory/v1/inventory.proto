// inventory.proto — contract for the Inventory service.
//
// STATUS: minimal proving pair only (epic E1). `GetItem` is defined and real;
// the rest of the RPC surface is deferred to the epic named below.
//
// Deferred: CreateItem, UpdateItem, DeleteItem, ListItems, WatchStock,
// ReserveItem (TODO(E3)); EnrichItem (TODO(E4)); GetItemWithPricing (TODO(E3)).
syntax = "proto3";

package inventory.v1;

option java_package = "com.poc.inventory.v1";
option java_multiple_files = true;

// No price field — that's pricing-service's concern, composed by GetItemWithPricing.
message Item {
  string id = 1;
  string name = 2;
  string sku = 3;
  int32 quantity_available = 4;
}

message GetItemRequest {
  string item_id = 1;
}

message GetItemResponse {
  Item item = 1;
}

service InventoryService {
  // Returns NOT_FOUND if item_id doesn't exist.
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
}
