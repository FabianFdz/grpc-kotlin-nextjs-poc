// pricing.proto — contract for the Pricing service.
//
// STATUS: minimal proving pair only (epic E1). `GetPrice` is the only RPC
// this service needs (see CLAUDE.md's epic breakdown for E2).
syntax = "proto3";

package pricing.v1;

option java_package = "com.poc.pricing.v1";
option java_multiple_files = true;

message GetPriceRequest {
  string item_id = 1;
}

message GetPriceResponse {
  string item_id = 1;
  int32 base_price_cents = 2;
  // 0 means no discount currently active.
  int32 discount_percent = 3;
  // Empty string means no promotion currently active.
  string promotion_label = 4;
  string currency_code = 5;
}

service PricingService {
  // GetPrice returns the current base price, discount, and promotion for an
  // item id. Not implemented in this epic.
  rpc GetPrice(GetPriceRequest) returns (GetPriceResponse);
}
